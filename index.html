<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathura-Vrindavan Tour Map</title>
    
    <!-- Leaflet CSS link (Map ki styling ke liye) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Apne map container ki height set karna zaroori hai -->
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        #tour-map {
            width: 100%;
            height: 100vh; /* Pura screen cover karega */
        }
    </style>
</head>
<body>

    <!-- Yahan map load hoga -->
    <div id="tour-map"></div>

    <!-- Leaflet JS script (Map ke functions ke liye) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Step 1: Map ko initialize karna aur center point set karna 
        // (27.54, 77.68 Mathura aur Vrindavan ke beech ka point hai)
        const map = L.map('tour-map').setView([27.5400, 77.6800], 12); // '12' zoom level hai

        // Step 2: OpenStreetMap ki tiles (images) map par lagana
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Step 3: Humara Temple Data (JSON format mein)
        const temples = [
          {
            id: "T001",
            name: "Shri Banke Bihari Temple",
            city: "Vrindavan",
            timings: "Morning: 07:45 - 12:00 | Evening: 17:30 - 21:30",
            coordinates: { lat: 27.5806, lng: 77.6983 }
          },
          {
            id: "T002",
            name: "Shri Krishna Janmasthan",
            city: "Mathura",
            timings: "Morning: 05:00 - 12:00 | Evening: 16:00 - 21:30",
            coordinates: { lat: 27.5050, lng: 77.6738 }
          }
        ];

        // Step 4: Loop chala kar har mandir par marker (pin) aur popup lagana
        temples.forEach(temple => {
            // Marker lagana
            const marker = L.marker([temple.coordinates.lat, temple.coordinates.lng]).addTo(map);
            
            // Popup mein dikhne wala text (HTML format mein)
            const popupContent = `
                <div style="text-align: center;">
                    <h3 style="margin-bottom: 5px; color: #d35400;">${temple.name}</h3>
                    <p style="margin-top: 0; font-weight: bold;">${temple.city}</p>
                    <p style="font-size: 14px;">🕒 <b>Timings:</b><br>${temple.timings}</p>
                </div>
            `;
            
            // Marker ke sath popup bind karna
            marker.bindPopup(popupContent);
        });

    </script>
</body>
</html>
